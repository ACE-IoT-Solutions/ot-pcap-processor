[package]
name = "ot-pcap-processor"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"
description = "Passive BACnet/IP and Modbus/TCP packet capture processor"
readme = "README.md"
documentation = "https://docs.rs/ot-pcap-processor"
homepage = "https://github.com/ACE-IoT-Solutions/ot-pcap-processor"
repository = "https://github.com/ACE-IoT-Solutions/ot-pcap-processor"
keywords = ["bacnet", "modbus", "pcap", "otlp"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["dist/**", "target/**", ".cocoindex_code/**", "deploy/*.env"]

[dependencies]
bacnet-bip-codec = "=0.14.0"
bacnet-encoding = "=0.14.0"
bacnet-npdu = "=0.14.0"
bacnet-services = "=0.14.0"
clap = { version = "4.5", features = ["derive"] }
etherparse = "0.19"
pcap-file = "2.0"
rpcap-rs = "=0.2.0"
rustmod-core = "0.2"
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.53", features = ["io-util", "net", "rt-multi-thread", "time"] }
ureq = { version = "3.1", features = ["json"] }
